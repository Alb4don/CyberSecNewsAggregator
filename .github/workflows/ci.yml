name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pip-audit
      - name: Ruff
        run: ruff check cybersecnews.py
      - name: Bandit
        run: bandit --quiet -ll cybersecnews.py
      - name: Dependency audit
        run: pip-audit --progress-spinner off

  container:
    name: Container build, scan, smoke, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint Dockerfile
        run: docker run --rm -i --entrypoint hadolint hadolint/hadolint:v2.12.0 --failure-threshold error - < Dockerfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cybernews:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cybernews:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan repository for leaked secrets
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 -e DB_PATH=/tmp/ci-smoke.db cybernews:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then docker logs smoke; docker rm -f smoke; exit 1; fi
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          docker rm -f smoke
          [ "$code" = "200" ]
      - name: Lowercase image name
        id: image
        if: github.event_name == 'push'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
